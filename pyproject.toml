[project]
name = "cbom-compass"
version = "0.1.0"
description = "Cryptographic inventory and post-quantum readiness platform (SIH25164)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "PyYAML>=6.0",
    "lief>=0.14",        # ELF/PE/Mach-O import-table parsing
    "reportlab>=4.0",    # PDF risk summary
    "python-multipart>=0.0.9",   # multipart parsing for the upload endpoint
]

[project.scripts]
cbom-compass = "cbom_compass.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
aws = ["boto3>=1.34"]   # only needed for the aws:// cloud connector

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cbom_compass*"]

[tool.setuptools.package-data]
cbom_compass = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
