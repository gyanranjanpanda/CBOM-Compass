[project]
name = "cbom-compass"
version = "0.1.0"
description = "Cryptographic inventory and post-quantum readiness platform (SIH25164)"
requires-python = ">=3.11"
# Upper bounds are deliberate. Starlette 1.x deprecates the httpx-backed
# TestClient that `tests/test_api.py` and `tests/test_ingest.py` are built on,
# and floating onto it mid-evaluation would break the suite on a machine that
# resolves fresh. FastAPI and Starlette move together, so both are pinned.
dependencies = [
    "fastapi>=0.115,<0.116",
    "starlette>=0.41,<0.42",
    "uvicorn[standard]>=0.27,<0.36",
    "PyYAML>=6.0",
    "lief>=0.14",        # ELF/PE/Mach-O import-table parsing
    "reportlab>=4.0",    # PDF risk summary
    "python-multipart>=0.0.9",   # multipart parsing for the upload endpoint
]

[project.scripts]
cbom-compass = "cbom_compass.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27,<0.29"]
aws = ["boto3>=1.34"]                  # aws:// cloud connector
azure = ["azure-identity>=1.15", "azure-keyvault-keys>=4.9"]   # azure:// connector
gcp = ["google-cloud-kms>=2.21"]       # gcp:// connector
hsm = ["python-pkcs11>=0.7"]           # pkcs11:// hardware module connector
# Everything needed to exercise every live connector.
connectors = [
    "boto3>=1.34",
    "azure-identity>=1.15", "azure-keyvault-keys>=4.9",
    "google-cloud-kms>=2.21",
    "python-pkcs11>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cbom_compass*"]

[tool.setuptools.package-data]
cbom_compass = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: drives a real dashboard in Playwright. Deselect with -m 'not browser'.",
]
