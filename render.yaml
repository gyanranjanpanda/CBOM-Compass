# CBOM Compass on Render.
#
# `buildCommand` is a single script so that changing what the deployed estate
# contains is a repository change, not a dashboard edit.
services:
  - type: web
    name: cbom-compass
    runtime: python
    plan: free
    region: singapore
    healthCheckPath: /api/health
    buildCommand: ./render-build.sh
    startCommand: cbom-compass serve --host 0.0.0.0 --port $PORT
    envVars:
      # pyproject requires >=3.11; lief and reportlab both ship wheels for it.
      - key: PYTHON_VERSION
        value: "3.11.13"
      # The served policy. Without it the dashboard scores against built-in
      # defaults: every asset lands on the default criticality, so the heat map
      # collapses into one row and the Z slider moves nothing.
      - key: CBOM_POLICY
        value: crypto-policy.yaml
