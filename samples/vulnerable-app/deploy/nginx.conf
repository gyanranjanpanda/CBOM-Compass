server {
    listen 443 ssl http2;
    server_name payments.example.com;

    # TLSv1.1 should not still be here.
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:DHE-RSA-AES128-SHA:!aNULL;
    ssl_prefer_server_ciphers on;

    ssl_certificate     /etc/ssl/payments.crt;
    ssl_certificate_key /etc/ssl/payments.key;
}
