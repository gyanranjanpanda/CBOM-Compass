# strongSwan site-to-site tunnels to the settlement network.
config setup
    charondebug="ike 1, knl 1"

conn settlement-primary
    # Encryption, integrity and key agreement are three separate migration
    # problems. modp2048 is the one Shor breaks; aes256 and sha256 are fine.
    ike=aes256-sha256-modp2048!
    esp=aes256-sha256-modp2048!
    left=%defaultroute
    right=settlement.example.internal
    auto=start

conn legacy-branch
    # Still on the 2005 configuration.
    ike=3des-sha1-modp1024!
    esp=3des-sha1!
    right=branch-07.example.internal
    auto=add

conn pqc-pilot
    # strongSwan 6 adds ML-KEM as an additional key exchange round.
    ike=aes256gcm16-sha384-ecp384-ke1_mlkem768!
    esp=aes256gcm16-ke1_mlkem768!
    right=pilot.example.internal
    auto=add
